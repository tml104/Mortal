[evaluation]
output_dir = "./artifacts/mortal_conv2d_evaluations"
games = 400
games_per_batch = 64
seed_start = 10000
seed_key = 0x2000
save_logs = false
# torch_threads = 8
# rayon_threads = 16

[evaluation.challenger]
checkpoint = "./artifacts/mortal_precomputed_optimize/latest.pth"
device = "cuda:0"
enable_amp = true
enable_quick_eval = true
enable_rule_based_agari_guard = true
name = "challenger"

[evaluation.champion]
# 明确指定对手。可用另一次迁移/训练的新格式 checkpoint。
checkpoint = "./artifacts/mortal_precomputed_optimize_baseline/latest.pth"
device = "cuda:0"
enable_amp = true
enable_quick_eval = true
enable_rule_based_agari_guard = true
name = "champion"
